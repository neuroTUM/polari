name: Integration

# Runs with secrets from the `secrets` environment. Only code that a
# maintainer has pushed to this repository (main, ci/**, or the merge queue)
# ever reaches this workflow; fork PR code never does.
on:
  push:
    branches:
      - main
      - "ci/**"
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test_integration:
    name: "test:integration"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6" # newest uv with a checksum known to the pinned setup-uv
          enable-cache: false # never restore a cache into a job that holds secrets
      - run: uv sync --locked --all-packages
      - name: pytest (integration)
        env:
          NEXTCLOUD_USERNAME: ${{ secrets.NEXTCLOUD_USERNAME }}
          NEXTCLOUD_PASSWORD: ${{ secrets.NEXTCLOUD_PASSWORD }}
          NEXTCLOUD_ROOT_PATH: ${{ vars.NEXTCLOUD_ROOT_PATH }} # non-secret environment variable
        run: uv run pytest -m integration
