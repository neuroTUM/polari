[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["packages/*/src", "packages/*/tests/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
files = ["packages/polari-app/src", "packages/polari-app/tests"]
